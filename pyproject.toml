[project]
name = "coenergy-assessment"
version = "0.1.0"
description = "Prédiction multi-indicateurs (HLC, Hb, constantes de temps) à partir de simulations thermiques dynamiques."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Modèles de référence non neuronaux et recherche d'hyperparamètres (annexe A2) ;
# les modèles de deep learning n'utilisent que PyTorch.
references = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coenergy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
